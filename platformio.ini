[platformio]
default_envs = tx

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2

[env:tx]
build_flags =
    -D CANLINK_AIR=0
    -D CRYPTO_NODE_ID=0xA1B2C3D4UL
    -D CRYPTO_PEER_ID=0x11223344UL
build_src_filter =
    +<common/>
    +<tx/>
    -<rx/>

[env:rx]
build_flags =
    -D CANLINK_AIR=1
    -D CRYPTO_NODE_ID=0x11223344UL
    -D CRYPTO_PEER_ID=0xA1B2C3D4UL
build_src_filter =
    +<common/>
    +<rx/>
    -<tx/>
