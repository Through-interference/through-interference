[platformio]
default_envs = tx

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib

[env:tx]
build_flags =
    -D CRYPTO_NODE_ID=0xA1B2C3D4UL
    -D CRYPTO_PEER_ID=0x11223344UL
build_src_filter =
    +<common/>
    +<tx/>
    -<rx/>

[env:rx]
build_flags =
    -D CRYPTO_NODE_ID=0x11223344UL
    -D CRYPTO_PEER_ID=0xA1B2C3D4UL
build_src_filter =
    +<common/>
    +<rx/>
    -<tx/>
